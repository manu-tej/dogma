[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quration"
version = "0.1.0"
description = "Graph-grounded computational biology research workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Manu Arrojwala"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # LLM
    "anthropic>=0.34.0",

    # Data fetching
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # Data processing
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",  # For Parquet
    "polars>=1.0.0",  # OptimusKG grounding/KG tables (imported by hypothesis.orchestrator)

    # Ontology and semantic
    "rdflib>=7.0.0",  # For JSON-LD

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",  # Beautiful terminal output
    "pyyaml>=6.0.1",

    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",

    # Utilities
    "tenacity>=8.3.0",  # Retry logic
    # Observability
    "langfuse>=2.50.0",  # LLM observability
    "python-json-logger>=2.0.7",  # Structured logging
    "prometheus-client>=0.20.0",  # Metrics collection
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
]

database = [
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",  # Async PostgreSQL driver
    "psycopg2-binary>=2.9.9",  # PostgreSQL (sync driver, for migrations)
    "alembic>=1.13.0",  # Database migrations
    "duckdb>=1.0.0",  # Analytics database
    "redis>=5.0.0",  # Redis cache
    "redis[hiredis]>=5.0.0",  # Redis with hiredis for performance
]

aws = [
    "boto3>=1.34.0",  # AWS Bedrock
]

gcp = [
    "google-cloud-aiplatform>=1.56.0",  # Vertex AI
]

observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

single-cell = [
    "anndata>=0.10.0",        # Single-cell data structure
    "scanpy>=1.10.0",         # Single-cell analysis toolkit
    "scipy>=1.11.0",          # Sparse matrices
    "h5py>=3.9.0",            # HDF5 file I/O
]

# Ground the Method Broker on the methods-graph knowledge graph (EDAM + nf-core +
# BioContainers) instead of the 5 hardcoded methods. After installing, point the
# broker at a built graph with QURATION_METHODS_GRAPH_DB=/path/to/methods.kuzu.
#
# methods-graph is NOT on PyPI. The requirement is pinned to a direct git URL at
# an immutable commit SHA so no resolver ever consults PyPI for the (generic,
# squattable) name "methods-graph" (dependency-confusion) and the ref can't move
# under us (mutable-branch supply-chain risk). Bump the SHA deliberately in a
# reviewed change. Local development may install an explicit editable checkout
# manually; the monorepo manifest does not assume a sibling directory exists.
methods-graph = [
    # methods-graph @ feat/methods-graph-mvp 6298305e712a727af60adb4ea9a1893b056b378c
    "methods-graph @ git+https://github.com/manu-tej/methods-graph@6298305e712a727af60adb4ea9a1893b056b378c",  # pulls kuzu transitively
]

all = [
    "quration[dev,database,aws,gcp,observability,single-cell,docs]"
]

[project.scripts]
quration = "quration.cli:main"
quration-analyze = "quration.analysis.cli:main"

[project.urls]
Homepage = "https://github.com/manu-tej/dogma"
Repository = "https://github.com/manu-tej/dogma"
Documentation = "https://github.com/manu-tej/dogma/blob/master/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quration = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "integration: tests that require live external services or network access",
]
